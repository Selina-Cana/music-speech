<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { padding: 2rem; }
    .audio-table audio { width: 100%; }
  </style>
</head>
<body>
  <h1>🎵 Audio Separation Demo</h1>
  <p class="text-muted">点击每首歌展开伴奏结果试听</p>

  <!-- Hotel California -->
  <div class="card mb-4">
    <div class="card-header">
      <a data-bs-toggle="collapse" href="#hotelCollapse" role="button">
        Hotel California - Eagles（点击展开）
      </a>
    </div>
    <div class="card-body">
      <p><strong>🎧 原始混合音频：</strong></p>
      <audio controls src="demo/Hotel California-Eagles.mp3"></audio>

      <div class="collapse mt-3" id="hotelCollapse">
        <p><strong>🎼 分离出的伴奏：</strong></p>
        <audio controls src="demo/accompaniment.wav"></audio>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
